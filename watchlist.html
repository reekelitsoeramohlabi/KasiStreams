<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasiStream | My Watchlist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark-custom text-light">

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-nav-custom sticky-top border-bottom border-secondary">
      <div class="container">
        <a class="navbar-brand fw-bold brand-logo" href="index.html">
          <span class="brand-accent">KASI</span>STREAM
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="movies.html">Catalogue</a></li>
            <li class="nav-item">
              <a class="nav-link active" href="watchlist.html">
                My List <span id="navWatchlistCount" class="badge bg-accent ms-1">0</span>
              </a>
            </li>
            <li class="nav-item"><a class="nav-link" href="about.html">About &amp; Help</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section aria-labelledby="watchlistHeading">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
          <h1 id="watchlistHeading" class="h2 fw-bold mb-1">My Personal Watchlist</h1>
          <p class="text-light-muted mb-0">Saved automatically in your browser via <code>localStorage</code>.</p>
        </div>
        <button id="clearWatchlistBtn" class="btn btn-outline-danger btn-sm">Clear Entire List</button>
      </div>

      <div id="alertContainer" aria-live="polite"></div>

      <!-- Watchlist Grid -->
      <div id="watchlistGrid" class="row g-4">
        <!-- Populated dynamically via JS -->
      </div>
    </section>
  </main>

  <!-- Title Details & Video Player Modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-card-custom text-light border-secondary">
        <div class="modal-header border-secondary">
          <h3 class="modal-title h5 fw-bold" id="detailsModalTitle">Title Details</h3>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="detailsModalBody"></div>
      </div>
    </div>
  </div>

  <footer class="bg-nav-custom text-center text-light-muted py-4 mt-5 border-top border-secondary">
    <div class="container">
      <p class="mb-0 small">&copy; 2026 KasiStream Group Project. Persistent Watchlist Demo.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
