<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasiStream | Browse Catalogue</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark-custom text-light">

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-nav-custom sticky-top border-bottom border-secondary">
      <div class="container">
        <a class="navbar-brand fw-bold brand-logo" href="index.html">
          <span class="brand-accent">KASI</span>STREAM
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="movies.html">Catalogue</a></li>
            <li class="nav-item">
              <a class="nav-link" href="watchlist.html">
                My List <span id="navWatchlistCount" class="badge bg-accent ms-1">0</span>
              </a>
            </li>
            <li class="nav-item"><a class="nav-link" href="about.html">About &amp; Help</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section aria-labelledby="catalogueHeading">
      <h1 id="catalogueHeading" class="h2 fw-bold mb-2">Explore Catalogue</h1>
      <p class="text-light-muted mb-4">Browse all 12 films, series, documentaries, and educational titles.</p>

      <div id="alertContainer" aria-live="polite"></div>

      <!-- Search & Filter Controls -->
      <div class="row g-3 bg-card-custom p-3 rounded-3 border border-secondary mb-4">
        <div class="col-md-5">
          <label for="searchInput" class="form-label small text-light-muted">Search by Title or Keyword</label>
          <input type="search" id="searchInput" class="form-control bg-dark text-light border-secondary" placeholder="Type title or description...">
        </div>
        <div class="col-md-4">
          <label for="genreFilter" class="form-label small text-light-muted">Filter by Genre</label>
          <select id="genreFilter" class="form-select bg-dark text-light border-secondary">
            <option value="all">All Genres</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Documentary">Documentary</option>
            <option value="Education">Education</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="typeFilter" class="form-label small text-light-muted">Content Type</label>
          <select id="typeFilter" class="form-select bg-dark text-light border-secondary">
            <option value="all">All Types</option>
            <option value="Movie">Movie</option>
            <option value="Series">Series</option>
            <option value="Documentary">Documentary</option>
          </select>
        </div>
      </div>

      <p id="resultsCount" class="small text-light-muted mb-3">Showing 12 titles</p>

      <!-- Dynamic Catalogue Grid -->
      <div id="catalogueGrid" class="row g-4">
        <!-- Populated dynamically via JS -->
      </div>
    </section>
  </main>

  <!-- Title Details & Video Player Modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-card-custom text-light border-secondary">
        <div class="modal-header border-secondary">
          <h3 class="modal-title h5 fw-bold" id="detailsModalTitle">Title Details</h3>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="detailsModalBody"></div>
      </div>
    </div>
  </div>

  <footer class="bg-nav-custom text-center text-light-muted py-4 mt-5 border-top border-secondary">
    <div class="container">
      <p class="mb-0 small">&copy; 2026 KasiStream Group Project. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
